<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spam Ham Detection</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            width: 500px;
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
            color: #333;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: none;
            font-size: 16px;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: #007bff;
        }

        button {
            margin-top: 20px;
            padding: 12px 30px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Spam Ham Detection</h1>

        <form action="/predict" method="POST">

            <textarea
                name="input_text"
                placeholder="Enter your message here..."
                required
            ></textarea>

            <br>

            <button type="submit">Check Message</button>

        </form>

    </div>

</body>

</html>
