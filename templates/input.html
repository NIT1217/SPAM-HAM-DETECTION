<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Spam Ham Detection</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='input.css') }}">

</head>

<body>

    <div class="container">

        <h1>Spam Ham Detection</h1>

        <form action="/predict" method="POST">

            <textarea
                name="input_text"
                placeholder="Enter your message here..."
                required
            ></textarea>

            <button type="submit">
                Check Message
            </button>

        </form>

    </div>

</body>

</html>
